<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background-color: #2563eb;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            width: 85%;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1f2937;
            color: white;
        }
        
        .edit-btn {
            background-color: #2563eb;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
}

        .delete-btn {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
        }
        
        
        .search-form {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
}

.search-form input {
    width: 350px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.search-form button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
}

.search-form a {
    background-color: #6b7280;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 5px;
}
        
        
    </style>
</head>

<body>

<div class="navbar">
    <h2>Employee Management</h2>
    <a th:href="@{/add}">Add Employee</a>
</div>

<div class="container">

    <h1>Employee List</h1>
    
    <form th:action="@{/search}" method="get" class="search-form">

    <input type="text"
           name="keyword"
           placeholder="Search employee by name..."
           required>

    <button type="submit">Search</button>

    <a th:href="@{/}">Reset</a>

</form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.name}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.department}"></td>
                <td th:text="${employee.salary}"></td>

              <td>
                  <a class="edit-btn"
                   th:href="@{/edit/{id}(id=${employee.id})}">
                   Edit
                 </a>
                 
                 <a class="delete-btn"
                    th:href="@{/delete/{id}(id=${employee.id})}"
                    onclick="return confirm('Are you sure you want to delete this employee?');">
                    Delete
                 </a> 
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
              <td colspan="6">
                 No employees found. Add an employee to get started.
             </td>
           </tr>
        </tbody>
    </table>

</div>

</body>
</html>
